plugins {
    id 'java'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '1.8.12'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
}

group 'com.memestream'
version '1.0.0'
description 'A meme sharing platform'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'com.memestream.desktop'
    mainClass = 'com.memestream.desktop.App'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    useJUnitPlatform()
}

jlink {
    imageZip = project.file("${layout.buildDirectory.get().toString()}/distributions/app-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'MemeStream'
    }

    jpackage {
        installerOptions = [
                '--description', description,
                '--copyright', 'Copyright 2024',
                '--app-version', version,
                '--vendor', 'Meme Stream'
        ] as List<String>

        //Detect OS
        def os= org.gradle.internal.os.OperatingSystem.current()

        //Windows
        if (os.isWindows()){
            imageOptions += ['--icon', 'src/main/resources/com/memestream/desktop/icon/icon128x128.ico']
            installerOptions += [
                    '--win-per-user-install', '--win-dir-chooser',
                    '--win-menu', '--win-shortcut'
            ]
        }

        //MacOsX
        if (os.isMacOsX()){
            imageOptions += ['--icon', 'src/main/resources/mac__icon.icns']
        }

        //Linux
        if (os.isLinux()){
            imageOptions += ['--icon', 'src/main/resources/com/memestream/desktop/icon/icon128x128.png']
            installerOptions += [
                    '--linux-menu-group', 'Entertainment',
                    '--linux-shortcut',
                    '--linux-deb-maintainer', 'email@.com'
            ]
        }
    }

}

jlinkZip {
    group = 'distribution'
}